{% extends "base.html" %}
{% block title %}{% if paciente %}Editar{% else %}Novo{% endif %} Paciente{% endblock %}
{% block content %}
<h1>{% if paciente %}Editar Paciente{% else %}Novo Paciente{% endif %}</h1>

<form method="POST" class="form">
    <div class="form-grid">
        <div class="form-group full-width">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" value="{{ paciente.nome if paciente else '' }}" required>
        </div>

        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="date" id="data_nascimento" name="data_nascimento" value="{{ paciente.data_nascimento.strftime('%Y-%m-%d') if paciente and paciente.data_nascimento else '' }}">
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" value="{{ paciente.telefone if paciente else '' }}">
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" value="{{ paciente.email if paciente else '' }}">
        </div>

        <div class="form-group">
            <label for="contato_emergencia">Contato de Emergência</label>
            <input type="text" id="contato_emergencia" name="contato_emergencia" value="{{ paciente.contato_emergencia if paciente else '' }}">
        </div>

        <div class="form-group">
            <label for="tel_emergencia">Tel. Emergência</label>
            <input type="tel" id="tel_emergencia" name="tel_emergencia" value="{{ paciente.tel_emergencia if paciente else '' }}">
        </div>

        <div class="form-group">
            <label for="data_inicio">Data de Início</label>
            <input type="date" id="data_inicio" name="data_inicio" value="{{ paciente.data_inicio.strftime('%Y-%m-%d') if paciente and paciente.data_inicio else '' }}">
        </div>

        <div class="form-group">
            <label for="modalidade">Modalidade</label>
            <select id="modalidade" name="modalidade">
                {% for opt in ['Presencial', 'Online', 'Híbrido'] %}
                <option value="{{ opt }}" {% if paciente and paciente.modalidade == opt %}selected{% endif %}>{{ opt }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="frequencia">Frequência</label>
            <select id="frequencia" name="frequencia">
                {% for opt in ['Semanal', 'Quinzenal', 'Mensal'] %}
                <option value="{{ opt }}" {% if paciente and paciente.frequencia == opt %}selected{% endif %}>{{ opt }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="dia_horario">Dia/Horário Fixo</label>
            <input type="text" id="dia_horario" name="dia_horario" placeholder="Ex: Terça 14h" value="{{ paciente.dia_horario if paciente else '' }}">
        </div>

        <div class="form-group">
            <label for="valor_sessao">Valor da Sessão (R$)</label>
            <input type="number" id="valor_sessao" name="valor_sessao" step="0.01" min="0" value="{{ paciente.valor_sessao if paciente else '' }}">
        </div>

        <div class="form-group">
            <label for="forma_pagamento">Convênio/Particular</label>
            <select id="forma_pagamento" name="forma_pagamento">
                {% for opt in ['Particular', 'Convênio', 'PsyMeet'] %}
                <option value="{{ opt }}" {% if paciente and paciente.forma_pagamento == opt %}selected{% endif %}>{{ opt }}</option>
                {% endfor %}
            </select>
        </div>

        {% if paciente %}
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for opt in ['Ativo', 'Pausado', 'Alta', 'Desistência'] %}
                <option value="{{ opt }}" {% if paciente.status == opt %}selected{% endif %}>{{ opt }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <div class="form-group full-width">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" rows="3">{{ paciente.observacoes if paciente else '' }}</textarea>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{{ url_for('listar_pacientes') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
